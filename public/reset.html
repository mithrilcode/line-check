<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Choose a new password · Line Check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/line-check.css">
  <script defer src="/assets/js/pages/forms.js"></script>
  <script defer src="/assets/js/pages/reset.js"></script>
</head>
<body>
<div class="wrap auth">
  <header class="site-nav">
    <a class="logo" href="/">Line Check</a>
  </header>

  <form id="reset" class="card auth-card" novalidate>
    <div>
      <h1>Choose a new password</h1>
      <p class="sub">After you save it, you'll be signed out everywhere else.</p>
    </div>
    <div id="form-error" class="banner warn" role="alert" hidden></div>
    <div class="form">
      <label>New password <input name="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required></label>
      <label>Confirm password <input name="confirm" type="password" minlength="10" maxlength="200" autocomplete="new-password" required></label>
      <p class="wide sub">At least 10 characters.</p>
    </div>
    <div class="row"><span class="spacer"></span><button type="submit" class="btn primary">Save password</button></div>
  </form>
</div>
</body>
</html>
